<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario Comparison - FutureMe AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

```
<nav>
    <h2>FutureMe AI</h2>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/scenario">Scenario Comparison</a></li>
    </ul>
</nav>

<div class="container">
    <h1>Future Career Prediction</h1>

    <form id="predictionForm">
        <div class="card">
            <h3>Your Profile</h3>

            <label>Skill Level (1-10)</label>
            <input type="number" id="skill" min="1" max="10" required>

            <label>Experience (Years)</label>
            <input type="number" id="experience" min="0" required>
        </div>

        <button type="submit">Predict Future</button>
    </form>

    <div class="card" id="resultCard" style="display:none;">
        <h2>Prediction Result</h2>
        <p id="result"></p>
    </div>
</div>

<script>
    document.getElementById("predictionForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const skill = document.getElementById("skill").value;
        const experience = document.getElementById("experience").value;

        const response = await fetch("/api/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                skill: skill,
                experience: experience
            })
        });

        const data = await response.json();

        document.getElementById("resultCard").style.display = "block";
        document.getElementById("result").innerText = data.prediction;
    });
</script>
```

</body>
</html>
