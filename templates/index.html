<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureMe AI Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h1 class="text-center mb-4">
                FutureMe AI Predictor
            </h1>

            <form action="/predict" method="POST">

                <div class="mb-3">
                    <label class="form-label">Study Hours</label>
                    <input
                        type="number"
                        name="study"
                        class="form-control"
                        placeholder="Enter study hours"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Sleep Hours</label>
                    <input
                        type="number"
                        name="sleep"
                        class="form-control"
                        placeholder="Enter sleep hours"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Exercise Days</label>
                    <input
                        type="number"
                        name="exercise"
                        class="form-control"
                        placeholder="Exercise days per week"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Projects Completed</label>
                    <input
                        type="number"
                        name="projects"
                        class="form-control"
                        placeholder="Number of projects"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">
                    Predict My Future
                </button>

            </form>

        </div>

    </div>

</body>
</html>
