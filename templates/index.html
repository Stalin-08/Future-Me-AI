<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureMe AI Predictor</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

    body{
        min-height:100vh;
        background:linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 100%);
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .glass-card{
        background:rgba(255,255,255,0.95);
        backdrop-filter:blur(20px);
        border-radius:25px;
        padding:40px;
        box-shadow:0 15px 35px rgba(0,0,0,.2);
    }

    .form-control{
        border-radius:15px;
        height:55px;
        font-size:18px;
    }

    .form-control:focus{
        box-shadow:0 0 15px rgba(102,126,234,.5);
        border-color:#667eea;
    }

    .predict-btn{
        height:55px;
        border-radius:15px;
        font-size:18px;
        font-weight:bold;
    }

    .title{
        font-weight:700;
    }

    .subtitle{
        color:gray;
    }

</style>
```

</head>

<body>

<div class="container">

```
<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="glass-card">

            <div class="text-center mb-4">

                <h1 class="title text-primary">
                    <i class="bi bi-stars"></i>
                    FutureMe AI
                </h1>

                <p class="subtitle">
                    Predict your future growth using AI powered lifestyle analytics
                </p>

            </div>

            <form action="/predict" method="POST">

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        <i class="bi bi-book-fill"></i>
                        Study Hours
                    </label>

                    <input
                        type="number"
                        name="study"
                        class="form-control"
                        placeholder="Hours studied per day"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        <i class="bi bi-moon-stars-fill"></i>
                        Sleep Hours
                    </label>

                    <input
                        type="number"
                        name="sleep"
                        class="form-control"
                        placeholder="Hours slept per day"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100 predict-btn">

                    <i class="bi bi-rocket-takeoff-fill"></i>
                    Predict My Future

                </button>

            </form>

        </div>

    </div>

</div>
```

</div>

</body>
</html>
